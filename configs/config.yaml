# Reproducibility -----------------------------------------------------
random_state: 42

# Paths ----------------------------------------------------------------
log_dir: 'tb_logs'

# Data -----------------------------------------------------------------
games: ['freeway']
num_actions: 18
batch_size: 32
size_x: 84
size_y: 84
grey_scale: True

# Training -------------------------------------------------------------
epochs: 20

# Conv JEPA ------------------------------------------------------------
conv_jepa_dim: 512 # latent size of the CNN encoder
conv_jepa_frames: 2 # frames fed to the encoder
conv_jepa_horizon: 8 # future steps rolled out (= actions conditioned on), 8 steps ~ 0.5 s
conv_jepa_action_dim: 3 # steer, gas, brake
conv_jepa_act_embed: 32 # size of the action embedding
conv_jepa_lr: 3.0e-4
conv_jepa_weight_decay: 1.0e-4
conv_jepa_ema: 0.99 # EMA decay of the target encoder
conv_jepa_reg: 1.0 # weight of the variance hinge (anti-collapse)
conv_jepa_constraint_weight: 1.0 # weight of the constraint regression loss
conv_jepa_constraint_hidden: 128 # hidden size of the constraint head
conv_jepa_stl_weight: 5.0 # weight of the STL robustness loss (0 switches it off)
conv_jepa_violation_weight: 10.0 # extra weight on squared error where the true margin is below 0 (violations are rare)
conv_jepa_constraint_to_encoder: True # False: head only probes (gradient detached from the encoder)
log_every_n_steps: 10

# Env data collection --------------------------------------------------
collect:
  episodes: 100 # number of generated tracks
  max_steps: 6000 # emergency cap per episode, in recorded steps
  frame_skip: 3 # simulator steps per recorded step; the action is held (50 / frame_skip Hz)
  seed: 42 # first track seed, incremented per episode
  output: 'dataset' # new directory per run (one tar per episode); existing datasets are not overwritten
  collection_mode: 'images' # watch | data | images
  image_resolution: 'low' # low | middle | high
  render: true # show the live simulator
  domain_randomize: False # randomize road/background colors
  exploration: 0.08 # steering noise strength, 0 to 1
  max_speed: 48.0 # straight speed target (world units/s)
  corner_speed: 16.0 # minimum curvature-based speed target
  safe_exploration: True # False: steering noise stays at full strength near the road edge
  boundary_recovery: True # False: no edge-recovery override, so the car can leave the road
  speed_scale: [0.96, 1.0] # per-episode speed factor range [low, high]; above 1 overshoots corners
  babble_prob: 0.0 # chance per decision to start a random-action burst (0 = off); makes actions independent of the scene
  babble_steps: [5, 20] # burst length range, in recorded steps
  babble_amp: 1.0 # max |steering| in a burst
  abort_spin: False # early cutoff on extreme spin

# CarRacing episode windows --------------------------------------------
dataset:
  root: 'dataset' # folder of run subfolders, each with data_info.json and episode tars
  split_file: 'dataset/split.json' # which seeds went to train/val/test
  val_per_run: 3 # held-out seeds per run for validation
  test_per_run: 2 # held-out seeds per run for testing
  window_length: 10 # frames per sample; ConvJEPA needs conv_jepa_frames + conv_jepa_horizon
  stride: 1 # recorded steps between window starts
  skip_intro: 20 # drop the zoom-in intro frames
  preprocess: ['crop_hud', 'grayscale', 'resize'] # ordered image steps: crop_hud | grayscale | resize (ConvJEPA needs grayscale)
  hud_rows: 12 # bottom rows of the 96x96 frame that show speed/steering bars (leaks state)
  image_size: 84 # target size for the resize step (the conv trunk is built for this size)
  shuffle_buffer: 1000 # windows held for shuffling (train only)
  batch_size: 32
  num_workers: 4

# Physical constraints -------------------------------------------------
# margin = (signal - threshold) / scale for a lower bound, (threshold - signal) / scale
# for an upper bound. Positive means satisfied. Order here is the output order.
constraints:
  road_clearance: {signal: clearance, bound: lower, threshold: 0.0, scale: 3.0} # stay on the road
  heading_error: {signal: abs_heading, bound: upper, threshold: 0.4, scale: 0.3} # rad, stay aligned with the road
  speed_limit: {signal: speed, bound: upper, threshold: 50.0, scale: 20.0} # world units/s
  sideslip: {signal: abs_sideslip, bound: upper, threshold: 0.1, scale: 0.1} # rad, stay stable
  keep_pace: {signal: road_speed, bound: lower, threshold: 16.0, scale: 10.0} # speed along the road stays above the corner pace

# STL specs over constraint margins ------------------------------------
# Nodes: pred | always | eventually | not | and | or | implies (see src/stl/specs.py).
# Windows are dataset.window_length frames long; robustness is read at the first frame.
stl:
  scale: 5.0 # logsumexp smoothing for training (<= 0 would mean exact min/max)
  specs:
    stay_on_road: {always: {pred: road_clearance}}
    obey_speed_limit: {always: {pred: speed_limit}}
    stay_aligned: {always: {pred: heading_error}}
    recover_to_road: {always: {implies: [{not: {pred: road_clearance}}, {eventually: {pred: road_clearance}}]}}

# Constraint-space dynamics experiment (state only, no images) ---------
dynamics:
  horizon: 8 # rollout steps evaluated (window = horizon + 1 frames)
  representations: [margins, augmented, augmented_preview, raw_state]
  ego_states: [omega, e_y, e_theta, d_left, d_right, kappa, speed, beta] # 'ego_state': the car-centered state a camera can observe
  augment_states: [e_y, omega, kappa, speed, e_theta, beta] # added to the margins in 'augmented'; the signed e_theta and beta matter most (margins use their abs)
  train_rollouts: [1, 8] # autoregressive steps used in the training loss
  seeds: [1, 2, 3]
  hidden: 256
  epochs: 20
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  std_floor: 1.0e-6 # added to the normalization std so constant dimensions stay finite
  results_file: 'results/dynamics_results.json'
  final_train_rollout: 8 # training of the dynamics saved for the transfer variants
  final_seed: 1

# Camera encoder -> constraint-space vector (Stage 4) ------------------
encoder:
  dim: 512 # width of the conv trunk's latent
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-4
  log_every: 200 # steps between logged mean training losses
  augmentation: # applied per training window, the same to all of its frames; no flips
    brightness: 0.1 # additive, uniform in +/- this
    contrast: 0.2 # multiplicative around the window mean, uniform in 1 +/- this
    noise_std: 0.02 # gaussian pixel noise (images are in [0, 1])
    max_shift: 2.0 # translation in pixels, uniform in +/- this (both axes)

# Frozen-dynamics transfer (Stage 5) -----------------------------------
# Each variant: a dynamics model trained on `representation`, and a camera encoder trained
# to output that representation. constraint_space is the proposal; raw_state is the
# conventional state-estimation baseline.
transfer:
  results_file: 'results/transfer_results.json'
  variants:
    constraint_space:
      representation: augmented
      dynamics_checkpoint: 'checkpoints/constraint_space_dynamics.pt'
      dynamics_results: 'results/constraint_space_dynamics.json'
      encoder_checkpoint: 'checkpoints/constraint_space_encoder.pt'
      encoder_results: 'results/constraint_space_encoder.json'
      train_dynamics: True
      active: False # False: skipped by training and transfer evaluation (checkpoint removed)
      frames: 2 # stacked frames the encoder sees; the target is the representation at the last one
      max_steps: 6000
      alignment_weight: 1.0
      rollout_weight: 0.0
      seed: 0
      grad_clip: 0.0 # max gradient norm; 0 = no clipping
      lr_schedule: constant # constant | cosine (decay to 0 after warmup)
      warmup_steps: 0
      arch: small # small (Atari-style CNN) | resnet
      pool: flatten # resnet only: global (average) | flatten
      augment: False # image augmentation of the training batches (encoder.augmentation)
    constraint_space_rollout: # same frozen dynamics; the encoder also learns from the rollout error
      representation: augmented
      dynamics_checkpoint: 'checkpoints/constraint_space_dynamics.pt'
      encoder_checkpoint: 'checkpoints/constraint_space_rollout_encoder.pt'
      encoder_results: 'results/constraint_space_rollout_encoder.json'
      train_dynamics: False
      active: False # False: skipped by training and transfer evaluation (checkpoint removed)
      frames: 2 # stacked frames the encoder sees; the target is the representation at the last one
      max_steps: 6000
      alignment_weight: 1.0
      rollout_weight: 1.0
      seed: 0
      grad_clip: 0.0 # max gradient norm; 0 = no clipping
      lr_schedule: constant # constant | cosine (decay to 0 after warmup)
      warmup_steps: 0
      arch: small # small (Atari-style CNN) | resnet
      pool: flatten # resnet only: global (average) | flatten
      augment: False # image augmentation of the training batches (encoder.augmentation)
    ego_state:
      representation: ego_state
      dynamics_checkpoint: 'checkpoints/ego_state_dynamics.pt'
      dynamics_results: 'results/ego_state_dynamics.json'
      encoder_checkpoint: 'checkpoints/ego_state_encoder.pt'
      encoder_results: 'results/ego_state_encoder.json'
      train_dynamics: True
      active: False # False: skipped by training and transfer evaluation (checkpoint removed)
      frames: 2 # stacked frames the encoder sees; the target is the representation at the last one
      max_steps: 6000
      alignment_weight: 1.0
      rollout_weight: 0.0
      seed: 0
      grad_clip: 0.0 # max gradient norm; 0 = no clipping
      lr_schedule: constant # constant | cosine (decay to 0 after warmup)
      warmup_steps: 0
      arch: small # small (Atari-style CNN) | resnet
      pool: flatten # resnet only: global (average) | flatten
      augment: False # image augmentation of the training batches (encoder.augmentation)
    ego_state_rollout:
      representation: ego_state
      dynamics_checkpoint: 'checkpoints/ego_state_dynamics.pt'
      encoder_checkpoint: 'checkpoints/ego_state_rollout_encoder.pt'
      encoder_results: 'results/ego_state_rollout_encoder.json'
      train_dynamics: False
      active: False # False: skipped by training and transfer evaluation (checkpoint removed)
      frames: 2 # stacked frames the encoder sees; the target is the representation at the last one
      max_steps: 6000
      alignment_weight: 1.0
      rollout_weight: 1.0
      seed: 0
      grad_clip: 0.0 # max gradient norm; 0 = no clipping
      lr_schedule: constant # constant | cosine (decay to 0 after warmup)
      warmup_steps: 0
      arch: small # small (Atari-style CNN) | resnet
      pool: flatten # resnet only: global (average) | flatten
      augment: False # image augmentation of the training batches (encoder.augmentation)
    raw_state:
      representation: raw_state
      dynamics_checkpoint: 'checkpoints/raw_state_dynamics.pt'
      dynamics_results: 'results/raw_state_dynamics.json'
      encoder_checkpoint: 'checkpoints/raw_state_encoder.pt'
      encoder_results: 'results/raw_state_encoder.json'
      train_dynamics: True
      active: False # False: skipped by training and transfer evaluation (checkpoint removed)
      frames: 2 # stacked frames the encoder sees; the target is the representation at the last one
      max_steps: 6000
      alignment_weight: 1.0
      rollout_weight: 0.0
      seed: 0
      grad_clip: 0.0 # max gradient norm; 0 = no clipping
      lr_schedule: constant # constant | cosine (decay to 0 after warmup)
      warmup_steps: 0
      arch: small # small (Atari-style CNN) | resnet
      pool: flatten # resnet only: global (average) | flatten
      augment: False # image augmentation of the training batches (encoder.augmentation)
    constraint_space_f4: # option 2: more context frames
      representation: augmented
      dynamics_checkpoint: 'checkpoints/constraint_space_dynamics.pt'
      encoder_checkpoint: 'checkpoints/constraint_space_f4_encoder.pt'
      encoder_results: 'results/constraint_space_f4_encoder.json'
      train_dynamics: False
      active: False # False: skipped by training and transfer evaluation (checkpoint removed)
      frames: 4
      max_steps: 6000
      alignment_weight: 1.0
      rollout_weight: 0.0
      seed: 0
      grad_clip: 0.0 # max gradient norm; 0 = no clipping
      lr_schedule: constant # constant | cosine (decay to 0 after warmup)
      warmup_steps: 0
      arch: small # small (Atari-style CNN) | resnet
      pool: flatten # resnet only: global (average) | flatten
      augment: False # image augmentation of the training batches (encoder.augmentation)
    constraint_space_long: # option 2: longer training
      representation: augmented
      dynamics_checkpoint: 'checkpoints/constraint_space_dynamics.pt'
      encoder_checkpoint: 'checkpoints/constraint_space_long_encoder.pt'
      encoder_results: 'results/constraint_space_long_encoder.json'
      train_dynamics: False
      active: False # False: skipped by training and transfer evaluation (checkpoint removed)
      frames: 2
      max_steps: 20000
      alignment_weight: 1.0
      rollout_weight: 0.0
      seed: 0
      grad_clip: 0.0 # max gradient norm; 0 = no clipping
      lr_schedule: constant # constant | cosine (decay to 0 after warmup)
      warmup_steps: 0
      arch: small # small (Atari-style CNN) | resnet
      pool: flatten # resnet only: global (average) | flatten
      augment: False # image augmentation of the training batches (encoder.augmentation)
    constraint_space_f4_long: # option 2: both
      representation: augmented
      dynamics_checkpoint: 'checkpoints/constraint_space_dynamics.pt'
      encoder_checkpoint: 'checkpoints/constraint_space_f4_long_encoder.pt'
      encoder_results: 'results/constraint_space_f4_long_encoder.json'
      train_dynamics: False
      active: False # False: skipped by training and transfer evaluation (checkpoint removed)
      frames: 4
      max_steps: 20000
      alignment_weight: 1.0
      rollout_weight: 0.0
      seed: 0
      grad_clip: 0.0 # max gradient norm; 0 = no clipping
      lr_schedule: constant # constant | cosine (decay to 0 after warmup)
      warmup_steps: 0
      arch: small # small (Atari-style CNN) | resnet
      pool: flatten # resnet only: global (average) | flatten
      augment: False # image augmentation of the training batches (encoder.augmentation)
    constraint_space_stable: # option 2A: clipping + warmup + cosine decay (seed 1 of the 3-seed comparison)
      representation: augmented
      dynamics_checkpoint: 'checkpoints/constraint_space_dynamics.pt'
      encoder_checkpoint: 'checkpoints/constraint_space_stable_encoder.pt'
      encoder_results: 'results/constraint_space_stable_encoder.json'
      train_dynamics: False
      active: False # False: skipped by training and transfer evaluation (checkpoint removed)
      frames: 2
      max_steps: 20000
      alignment_weight: 1.0
      rollout_weight: 0.0
      seed: 1
      grad_clip: 1.0
      lr_schedule: cosine
      warmup_steps: 500
      arch: small # small (Atari-style CNN) | resnet
      pool: flatten # resnet only: global (average) | flatten
      augment: False # image augmentation of the training batches (encoder.augmentation)
    constraint_space_resnet: # option 2B: residual CNN, global pooling (seed 1 of the 3-seed comparison)
      representation: augmented
      dynamics_checkpoint: 'checkpoints/constraint_space_dynamics.pt'
      encoder_checkpoint: 'checkpoints/constraint_space_resnet_encoder.pt'
      encoder_results: 'results/constraint_space_resnet_encoder.json'
      train_dynamics: False
      active: True # False: skipped by training and transfer evaluation (checkpoint removed)
      frames: 2
      max_steps: 20000
      alignment_weight: 1.0
      rollout_weight: 0.0
      seed: 1
      grad_clip: 1.0
      lr_schedule: cosine
      warmup_steps: 500
      arch: resnet
      pool: global
      augment: False # image augmentation of the training batches (encoder.augmentation)

# Env episode replay ---------------------------------------------------
preview:
  episode: 'dataset/episode_00000.tar' # episode tar
  fps: 50 # playback frame rate (50 = real time)
