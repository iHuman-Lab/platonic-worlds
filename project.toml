[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platonic-worlds"
version = "0.1.0"
description = "A constraint-space representation learning which can provide a modality-independent description of the world, enabling heterogeneous observations to be mapped into a shared representation that preserves physical constraints and their temporal semantics."
authors = "Your name (or your organization/company/team)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "click",
    "Sphinx",
    "coverage",
    "awscli",
    "flake8",
    "python-dotenv>=0.5.1",
    "python3",
    "pathlib2",
    # Env data collection (CarRacing-v3); swig is needed to build Box2D
    "numpy>=1.26,<3",
    "pillow",
    "gymnasium[box2d]==1.3.0",
    "box2d==2.3.10",
    "pygame-ce>=2.1.3",  # provides the pygame module
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "black",
    "isort",
    "mypy"
]

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "src"}

# Ruff: Linting, PEP8, and naming convention enforcement
[tool.ruff]
select = ["E", "F", "N"]  # E: pycodestyle, F: pyflakes, N: pep8-naming
line-length = 88
target-version = "py38"

# pytest
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
